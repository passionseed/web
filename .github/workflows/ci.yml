name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Existing non-critical advisories are tracked in the security report.
      # Block new critical production dependencies while that debt is resolved.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches build-time failures (e.g. prerender reads of missing files)
      # before Vercel does. Env vars are dummies — the build must not depend
      # on real services.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # The whiteboard merge function runs against a throwaway Postgres in Docker,
  # with the same cases as the TypeScript copy of the SHIFT canvas rule, so the
  # two cannot drift apart. No secrets: it never touches a real database.
  whiteboard-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whiteboard SQL
        run: pnpm test:whiteboard-sql
