name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Existing non-critical advisories are tracked in the security report.
      # Block new critical production dependencies while that debt is resolved.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catches build-time failures (e.g. prerender reads of missing files)
      # before Vercel does. Env vars are dummies — the build must not depend
      # on real services.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # The whiteboard merge function runs against a throwaway Postgres in Docker,
  # with the same cases as the TypeScript copy of the SHIFT canvas rule, so the
  # two cannot drift apart. No secrets: it never touches a real database.
  whiteboard-sql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check whiteboard SQL
        run: pnpm test:whiteboard-sql

  # SHIFT High quests: every shift_quest migration on throwaway Postgres 15
  # databases (production's major, supabase/config.toml), applied once and
  # twice, then the database rules, island rules, bot flows and the web board
  # suite (side quests and the shift_quest_web allowlist, web_board.ts, wired
  # through run-local.sh), plus the bot typecheck and the deploy smoke check.
  # No secrets: it never touches a real database. It runs on every pull
  # request so it can be a required check, and skips its steps when nothing
  # it covers changed.
  shift-quests-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent, main's tip.
          fetch-depth: 2

      - name: Did quest files change?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != pull_request ] || ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "quests=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(supabase/migrations/[^/]*shift_quest|supabase/tests/shift_quests/|bot/|scripts/island-render-preview\.ts$|lib/content/shift-cohort\.ts$|lib/shift/voiceWindow\.ts$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)' <<<"$(git diff --name-only HEAD^1 HEAD)"; then
            echo "quests=true" >> "$GITHUB_OUTPUT"
          else
            echo "No quest files changed; skipping."
            echo "quests=false" >> "$GITHUB_OUTPUT"
          fi

      # supabase db push refuses a migration older than the newest applied
      # one, so new shift_quest files must sort after everything on main.
      - name: New quest migrations sort after main's newest
        if: steps.changes.outputs.quests == 'true' && github.event_name == 'pull_request'
        run: |
          base="$(git ls-tree --name-only HEAD^1 supabase/migrations/ | sed 's#.*/##' | sort)"
          newest="$(echo "$base" | grep -E '^[0-9]{14}_' | tail -n 1)"
          added="$(git ls-tree --name-only HEAD supabase/migrations/ | sed 's#.*/##' | sort | comm -13 <(echo "$base") - | grep shift_quest || true)"
          for f in $added; do
            if [[ ! "$f" > "$newest" ]]; then
              echo "::error file=supabase/migrations/$f::$f sorts before main's newest migration $newest. Rename the unapplied shift_quest files to timestamps after it (docs/features/shift-high-quests.md, migration runbook)."
              exit 1
            fi
          done
          echo "ok: $(echo ${added:-no new shift_quest migrations}) after $newest"

      - name: Install PostgreSQL 15
        if: steps.changes.outputs.quests == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common
          # Binaries only: run-local.sh makes its own throwaway cluster.
          echo 'create_main_cluster = false' | sudo tee -a /etc/postgresql-common/createcluster.conf >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-15
          /usr/lib/postgresql/15/bin/postgres --version

      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.quests == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quests == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.quests == 'true'
        run: pnpm install --frozen-lockfile

      - name: Quest database tests on Postgres 15
        if: steps.changes.outputs.quests == 'true'
        run: pnpm test:db:quests
        env:
          PG_BIN: /usr/lib/postgresql/15/bin

      - name: Typecheck the bot
        if: steps.changes.outputs.quests == 'true'
        run: pnpm exec tsc -p bot/tsconfig.json --noEmit

      # The same check bot/deploy.sh runs in the new image before a swap.
      - name: Bot smoke check and island render
        if: steps.changes.outputs.quests == 'true'
        run: |
          pnpm bot:smoke
          pnpm island:render --out "$RUNNER_TEMP/shift-island-preview.png"
