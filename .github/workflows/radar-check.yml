name: Radar guide check

# The full code-guide content check (docs/features/radar-guides-in-code.md 6.1):
# guide-lint with facts older than 45 days as errors, plus required clips on
# live guides. Jest skips fact age so a calendar date never blocks unrelated
# PRs; this workflow is where staleness is caught instead.
# - on PRs that touch guide content or the lint itself
# - weekly, opening (or commenting on) an issue when it fails
# Offline: no secrets, no database (radar:check without --db).

on:
  pull_request:
    paths:
      - "lib/radar-guides/**"
      - "lib/radar-guide/guide-lint.ts"
      - "lib/radar-guide/guide-types.ts"
      - "scripts/radar-guide/**"
      - ".github/workflows/radar-check.yml"
  schedule:
    # Mondays 02:00 UTC (09:00 Bangkok).
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: radar-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  radar-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code guides
        id: check
        run: pnpm radar:check --max-age 45 2>&1 | tee radar-check.log
        shell: bash -o pipefail {0}

      - name: Open an issue when the weekly check fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Radar guide check failed (stale facts or missing clips)"
          body="$(printf 'The weekly \`pnpm radar:check --max-age 45\` failed.\n\nRun: %s/%s/actions/runs/%s\n\n\`\`\`\n%s\n\`\`\`' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -n 60 radar-check.log)")"
          existing="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
