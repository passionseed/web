allowBuilds:
  core-js: set this to true or false
  esbuild: set this to true or false
  sharp: set this to true or false
  unrs-resolver: set this to true or false
ignoredBuiltDependencies:
  - core-js
  - esbuild
  - sharp
  - unrs-resolver
# Older embedding and diagram packages pin vulnerable transitive versions.
# Keep these overrides scoped to their existing major versions.
overrides:
  'react-tiny-oembed>axios': 0.34.0
  'lodash-es@4.17.21': 4.18.1
  'nanoid@3.3.3': 3.3.20
minimumReleaseAgeExclude:
  - '@next/env@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - next@16.4.4
